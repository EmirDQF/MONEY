name: SEACE Daily Scraper

on:
  schedule:
    # Lunes a viernes a las 8:00 AM hora de Perú (13:00 UTC)
    - cron: '0 13 * * 1-5'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias del sistema y Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Ejecutar Scraper SEACE
        run: |
          python seace_scraper.py --description "adquisicion"

      - name: Subir archivo de alertas generado
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alertas-seace
          path: alertas_hoy.txt
